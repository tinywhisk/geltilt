[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geltilt"
version = "0.1.0"
description = "Gel electrophoresis image editing: automatic rotation correction of lanes using vertical projection of band smears."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "geltilt" }]
dependencies = [
    "numpy>=1.23",
    "pillow>=9.0",
    "opencv-python-headless>=4.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
geltilt = "geltilt.cli:main"
geltilt-label = "geltilt.labeler:main"
geltilt-proj = "geltilt.projview:main"
geltilt-app = "geltilt.app.window:main"

[tool.setuptools.packages.find]
include = ["geltilt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]